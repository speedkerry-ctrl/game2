<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小中文發音大挑戰</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #1a1a2e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .phone-canvas { background: linear-gradient(to bottom, #11998e, #38ef7d); width: 100%; max-width: 430px; height: 92vh; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 頂部 HUD (包含跳關) */
        .top-hud { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; font-size: 1.1rem; font-weight: bold; background: rgba(0, 0, 0, 0.3); z-index: 10; }
        .skip-box { display: flex; align-items: center; gap: 4px; }
        .input-level { width: 45px; text-align: center; border-radius: 6px; border: 1px solid #ccc; padding: 2px 0; font-weight: bold; color: #333; }
        .btn-skip { background: #ffcc00; color: #1a1a2e; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        
        .speech-subtitle { position: absolute; top: 75px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.75); padding: 8px 16px; border-radius: 20px; font-size: 0.95rem; max-width: 85%; text-align: center; border: 1px solid #38ef7d; color: #38ef7d; z-index: 10; }
        .stage-3d { flex: 1; position: relative; perspective: 300px; }
        .runway { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) rotateX(45deg); transform-origin: bottom center; width: 180px; height: 85%; background: #2a2a40; border-left: 6px solid #38ef7d; border-right: 6px solid #38ef7d; }
        .runway::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 2px; height: 100%; border-left: 4px dashed #ffffff; }
        .finish-barrier { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 240px; height: 6px; background: #38ef7d; box-shadow: 0 0 10px #38ef7d; z-index: 2; }
        
        .challenge-card { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 5; will-change: transform, opacity; }
        .card-emoji { font-size: 5rem; }
        .card-word-box { background: #ffffff; color: #333; padding: 10px 24px; border-radius: 16px; border: 3px solid #38ef7d; box-shadow: 0 6px 0 #11998e; margin-top: 5px; text-align: center; display: flex; flex-direction: column; align-items: center; min-width: 160px; }
        .card-zh { font-size: 2.2rem; font-weight: bold; color: #1a1a2e; line-height: 1.1; white-space: nowrap; }
        .card-bpmf { font-size: 1rem; color: #666; font-weight: 500; margin-top: 4px; }
        
        .card-approach { animation: cardRush 7s linear forwards; }
        .card-fallback { transition: transform 0.4s ease-in, opacity 0.4s; transform: translateX(-50%) scale(0.1) translateY(-320px) !important; opacity: 0.3; }
        
        .bottom-area { padding: 20px; text-align: center; background: rgba(0,0,0,0.4); z-index: 10; }
        .btn-start { background-color: #38ef7d; color: #1a1a2e; font-size: 1.4rem; font-weight: bold; border: none; padding: 12px 35px; border-radius: 25px; cursor: pointer; box-shadow: 0 0 15px rgba(56,239,125,0.4); }
        .btn-start.active { background-color: #ff4757; color: white; box-shadow: 0 0 15px rgba(255,71,87,0.4); }
        
        @keyframes cardRush {
            0% { transform: translateX(-50%) scale(0.1) translateY(-300px); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateX(-50%) scale(1.1) translateY(-10px); opacity: 1; }
        }
    </style>
    <!-- 引入外部資料庫 zh-words.js -->
    <script src="zh-words.js"></script>
</head>
<body>
    <div class="phone-canvas">
        <div class="top-hud">
            <span id="level-num">Level: 1 / 100</span>
            <div class="skip-box">
                <input type="number" id="jump-input" class="input-level" min="1" max="100" value="1">
                <button class="btn-skip" onclick="jumpToLevel()">Skip</button>
            </div>
            <span id="score-num">Score: 0</span>
        </div>
        <div id="subtitle" class="speech-subtitle">點擊 START 開始中文朗讀挑戰！</div>
        <div class="stage-3d">
            <div class="runway"></div>
            <div class="finish-barrier"></div>
            <div id="challenge-card" class="challenge-card">
                <div id="emoji" class="card-emoji">🍎</div>
                <div class="card-word-box">
                    <div id="word-zh" class="card-zh">蘋果</div>
                    <div id="word-bpmf" class="card-bpmf">ㄆㄧㄥˊ ㄍㄨㄛˇ</div>
                </div>
            </div>
        </div>
        <div class="bottom-area">
            <button id="action-btn" class="btn-start" onclick="toggleGame()">START</button>
        </div>
    </div>

    <script>
        // 若 zh-words.js 載入失敗的預備資料
        const defaultWords = [
            { word: "蘋果", bpmf: "ㄆㄧㄥˊ ㄍㄨㄛˇ", emoji: "🍎" },
            { word: "香蕉", bpmf: "ㄒㄧㄤ ㄐㄧㄠ", emoji: "🍌" },
            { word: "貓咪", bpmf: "ㄇㄠ ㄇㄧ", emoji: "🐱" }
        ];

        const wordList = (typeof zhWords !== 'undefined') ? zhWords : defaultWords;
        
        let currentIdx = 0, score = 0, isPlaying = false, recognition = null, audioCtx = null;
        
        const actionBtn = document.getElementById('action-btn'),
              subtitleTxt = document.getElementById('subtitle'),
              wordZhTxt = document.getElementById('word-zh'),
              wordBpmfTxt = document.getElementById('word-bpmf'),
              emojiTxt = document.getElementById('emoji'),
              levelTxt = document.getElementById('level-num'),
              scoreTxt = document.getElementById('score-num'),
              challengeCard = document.getElementById('challenge-card'),
              jumpInput = document.getElementById('jump-input');
        
        challengeCard.onanimationend = function() { if (isPlaying) handleWrongAnswer(); };
        
        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(146, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }
        
        function initSpeechEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                subtitleTxt.innerText = '瀏覽器不支援語音辨識，請使用 Chrome！';
                return false;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = false;
            recognition.continuous = false;
            
            recognition.onstart = function() {
                if (isPlaying) subtitleTxt.innerText = '🎤 正在聆聽... 請唸出：「' + wordList[currentIdx].word + '」';
            };
            
            recognition.onresult = function(event) {
                if (!isPlaying) return;
                let userSpeech = event.results[0][0].transcript;
                if (userSpeech) {
                    subtitleTxt.innerText = '🗣️ 聽到：「' + userSpeech + '」';
                    let target = wordList[currentIdx].word;
                    if (userSpeech.includes(target) || target.includes(userSpeech)) {
                        handleCorrectAnswer();
                    }
                }
            };
            
            recognition.onend = function() {
                if (isPlaying) {
                    setTimeout(function() { try { recognition.start(); } catch(e) {} }, 50);
                }
            };
            return true;
        }
        
        function toggleGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!recognition && !initSpeechEngine()) return;
            
            if (isPlaying) {
                isPlaying = false;
                actionBtn.innerText = 'START';
                actionBtn.classList.remove('active');
                subtitleTxt.innerText = '遊戲已暫停';
                challengeCard.classList.remove('card-approach');
                recognition.stop();
            } else {
                isPlaying = true;
                actionBtn.innerText = 'LISTENING...';
                actionBtn.classList.add('active');
                scoreTxt.innerText = 'Score: ' + score;
                updateCardUI();
                try { recognition.start(); } catch(e) {}
            }
        }
        
        function handleCorrectAnswer() {
            playSound('correct');
            score += 10;
            scoreTxt.innerText = 'Score: ' + score;
            subtitleTxt.innerText = '🎉 發音正確！過關！';
            challengeCard.classList.remove('card-approach');
            isPlaying = false;
            if (recognition) recognition.stop();
            
            setTimeout(function() {
                currentIdx++;
                if (currentIdx < wordList.length) {
                    isPlaying = true;
                    updateCardUI();
                    try { recognition.start(); } catch(e) {}
                } else {
                    displayVictory();
                }
            }, 1200);
        }
        
        function handleWrongAnswer() {
            playSound('wrong');
            subtitleTxt.innerText = '❌ 時間到/沒聽清，退回重新挑戰！';
            isPlaying = false;
            if (recognition) recognition.stop();
            challengeCard.classList.remove('card-approach');
            challengeCard.classList.add('card-fallback');
            
            setTimeout(function() {
                challengeCard.classList.remove('card-fallback');
                isPlaying = true;
                updateCardUI();
                try { recognition.start(); } catch(e) {}
            }, 400);
        }
        
        /* 核心跳關邏輯 */
        function jumpToLevel() {
            let targetLevel = parseInt(jumpInput.value);
            if (isNaN(targetLevel) || targetLevel < 1 || targetLevel > wordList.length) return;
            
            currentIdx = targetLevel - 1;
            subtitleTxt.innerText = '⏭️ 已跳至第 ' + targetLevel + ' 關';
            challengeCard.classList.remove('card-approach');
            if (recognition) recognition.stop();
            
            updateCardUI();
            if (isPlaying) {
                try { recognition.start(); } catch(e) {}
            }
        }
        
        function updateCardUI() {
            levelTxt.innerText = 'Level: ' + (currentIdx + 1) + ' / ' + wordList.length;
            jumpInput.value = currentIdx + 1;
            jumpInput.max = wordList.length;
            
            wordZhTxt.innerText = wordList[currentIdx].word;
            wordBpmfTxt.innerText = wordList[currentIdx].bpmf || '';
            emojiTxt.innerText = wordList[currentIdx].emoji || '📖';
            
            challengeCard.classList.remove('card-approach');
            void challengeCard.offsetWidth; // 觸發重繪以重設動畫
            if (isPlaying) challengeCard.classList.add('card-approach');
        }
        
        function displayVictory() {
            isPlaying = false;
            if (recognition) recognition.stop();
            emojiTxt.innerText = '🏆';
            wordZhTxt.innerText = '挑戰成功！';
            wordBpmfTxt.innerText = '';
            subtitleTxt.innerText = '🔥 太棒了！你完成了全部 ' + wordList.length + ' 關！';
            actionBtn.style.display = 'none';
        }
        
        setTimeout(updateCardUI, 200);
    </script>
</body>
</html>
