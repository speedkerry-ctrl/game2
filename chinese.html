        function playSound(type) { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); if (type === 'correct') { osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.25); } else { osc.type = 'triangle'; osc.frequency.setValueAtTime(220, audioCtx.currentTime); osc.frequency.setValueAtTime(146, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } }

        function initSpeechEngine() { const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SpeechRecognition) { subtitleTxt.innerText = '瀏覽器不支援語音辨識，請使用 Chrome！'; return false; } recognition = new SpeechRecognition(); recognition.lang = 'zh-TW'; recognition.interimResults = false; recognition.continuous = false; recognition.onstart = function() { if (isPlaying) subtitleTxt.innerText = '🎤 正在聆聽... 請唸出：「' + wordList[currentIdx].word + '」'; }; recognition.onresult = function(event) { if (!isPlaying) return; let userSpeech = event.results[0][0].transcript; if (userSpeech) { subtitleTxt.innerText = '🗣️ 聽到：「' + userSpeech + '」'; let target = wordList[currentIdx].word; if (userSpeech.includes(target) || target.includes(userSpeech)) { handleCorrectAnswer(); } } }; recognition.onend = function() { if (isPlaying) { setTimeout(function() { try { recognition.start(); } catch(e) {} }, 50); } }; return true; }

        function toggleGame() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (!recognition && !initSpeechEngine()) return; if (isPlaying) { isPlaying = false; actionBtn.innerText = 'START'; actionBtn.classList.remove('active'); subtitleTxt.innerText = '遊戲已暫停'; challengeCard.classList.remove('card-approach'); recognition.stop(); } else { isPlaying = true; actionBtn.innerText = 'LISTENING...'; actionBtn.classList.add('active'); scoreTxt.innerText = score + '分'; updateCardUI(); try { recognition.start(); } catch(e) {} } }

        function handleCorrectAnswer() { playSound('correct'); score += 10; scoreTxt.innerText = score + '分'; subtitleTxt.innerText = '🎉 發音正確！過關！'; challengeCard.classList.remove('card-approach'); isPlaying = false; if (recognition) recognition.stop(); setTimeout(function() { currentIdx++; if (currentIdx < wordList.length) { isPlaying = true; updateCardUI(); try { recognition.start(); } catch(e) {} } else { displayVictory(); } }, 1200); }

        function handleWrongAnswer() { playSound('wrong'); subtitleTxt.innerText = '❌ 退回重新挑戰！'; isPlaying = false; if (recognition) recognition.stop(); challengeCard.classList.remove('card-approach'); challengeCard.classList.add('card-fallback'); setTimeout(function() { challengeCard.classList.remove('card-fallback'); isPlaying = true; updateCardUI(); try { recognition.start(); } catch(e) {} }, 400); }

        function jumpToLevel() { let targetLevel = parseInt(jumpInput.value); if (isNaN(targetLevel) || targetLevel < 1 || targetLevel > wordList.length) return; currentIdx = targetLevel - 1; subtitleTxt.innerText = '⏭️ 跳至第 ' + targetLevel + ' 關'; challengeCard.classList.remove('card-approach'); if (recognition) recognition.stop(); updateCardUI(); if (isPlaying) { try { recognition.start(); } catch(e) {} } }

        function updateCardUI() {
            let stageText = currentIdx < 33 ? " (國1)" : (currentIdx < 66 ? " (國2)" : " (國3)");
            levelTxt.innerText = (currentIdx + 1) + " / 100" + stageText;
            jumpInput.value = currentIdx + 1;
            wordZhTxt.innerText = wordList[currentIdx].word;
            wordBpmfTxt.innerText = wordList[currentIdx].bpmf || '';
            emojiTxt.innerText = wordList[currentIdx].emoji || '📖';
            challengeCard.classList.remove('card-approach');
            void challengeCard.offsetWidth;
            if (isPlaying) challengeCard.classList.add('card-approach');
        }

        function displayVictory() { isPlaying = false; if (recognition) recognition.stop(); emojiTxt.innerText = '🏆'; wordZhTxt.innerText = '挑戰成功！'; wordBpmfTxt.innerText = ''; subtitleTxt.innerText = '🔥 太棒了！你完成了全部 100 關！'; actionBtn.style.display = 'none'; }

        setTimeout(updateCardUI, 200);
    </script>
</body>
</html>
